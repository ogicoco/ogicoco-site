name: Temporary teacher image transfer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  transfer:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'temporary high-res teacher image transfer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download high-resolution teacher image
        run: |
          curl -fL --retry 3 'https://media.canva.com/v2/image-resize/format:JPG/height:859/quality:95/uri:ifs%3A%2F%2FM%2Ff712a01b-4a33-49f3-83e3-007cce3c2b35/watermark:F/width:700?csig=AAAAAAAAAAAAAAAAAAAAAMbod_76gKSyZSjWAdp6VaaAS6SlDzl_PB803KBL5HZf&exp=1794462184&osig=AAAAAAAAAAAAAAAAAAAAAGd0B5FShYej8pnx6uuLPxdYZ-4NHUvl9ii6vbWxmjHE&signer=media-rpc&token=AAIAAU0AJGY3MTJhMDFiLTRhMzMtNDlmMy04M2UzLTAwN2NjZTNjMmIzNQAAAAABoc5H8kDuFXM6pQOJkOuSTJ8ZPdIr0w-xOKoJS49T4p0jmBLhUA&x-canva-quality=screen' -o assets/images/teacher-profile-hq.jpg
          echo "Downloaded bytes: $(wc -c < assets/images/teacher-profile-hq.jpg)"
          file assets/images/teacher-profile-hq.jpg
          test "$(wc -c < assets/images/teacher-profile-hq.jpg)" -gt 50000
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/teacher-profile-hq.jpg
          git commit -m "Add high-resolution teacher profile image"
          git push
