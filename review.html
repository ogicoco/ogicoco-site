<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>おぎココへのご感想｜おぎココ学習塾・英語塾</title>
  <meta name="description" content="おぎココ学習塾・英語塾をご利用いただいた皆さまへ。Googleマップでのご感想をお聞かせください。" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#fffaf0" />
  <link rel="icon" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="script.js"></script>
  <style>
    .review-wrap{min-height:100vh;background:linear-gradient(180deg,#fffaf0,#f6fbfd);padding:56px 0 80px}
    .review-card{max-width:720px;margin:0 auto;background:#fff;border:1px solid #e6eef1;border-radius:30px;padding:42px;box-shadow:var(--shadow);text-align:center}
    .review-mark{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;background:var(--blue-pale);font-size:30px}
    .review-card h1{font-size:clamp(30px,5vw,44px);line-height:1.35;margin:0 0 16px}
    .review-card .lead{color:#58717a;font-size:17px;margin:0 auto 26px;max-width:580px}
    .review-note{margin:26px 0 0;padding:20px;border-radius:18px;background:var(--bg);text-align:left;color:#60757d}
    .review-note ol{margin:8px 0 0;padding-left:1.4em}
    .review-note li+li{margin-top:6px}
    .back-home{display:inline-block;margin-top:24px;color:var(--blue-dark);font-weight:800;text-underline-offset:4px}
    @media(max-width:600px){.review-wrap{padding:28px 0 48px}.review-card{padding:30px 22px;border-radius:24px}}
  </style>
</head>
<body>
  <main class="review-wrap">
    <div class="container">
      <div class="review-card">
        <div class="review-mark" aria-hidden="true">☆</div>
        <p class="eyebrow">おぎココをご利用いただいている皆さまへ</p>
        <h1>ご感想をお聞かせください</h1>
        <p class="lead">Googleマップの口コミは、これから塾を探すご家庭にとって大切な参考になります。通ってみて感じたことを、率直にお聞かせいただけましたら幸いです。</p>
        <a class="btn btn-line btn-large" href="https://www.google.com/maps/search/?api=1&query=%E3%81%8A%E3%81%8E%E3%82%B3%E3%82%B3%E8%8B%B1%E8%AA%9E%E5%A1%BE%E3%83%BB%E5%AD%A6%E7%BF%92%E5%A1%BE&query_place_id=ChIJY4KwBADzGGAReaugz76zSbE" target="_blank" rel="noopener noreferrer">Googleマップを開く</a>
        <div class="review-note">
          <strong>口コミ投稿の流れ</strong>
          <ol>
            <li>上のボタンからおぎココのGoogleマップを開く</li>
            <li>「口コミ」または「口コミを書く」を選ぶ</li>
            <li>星とコメントを入力して投稿する</li>
          </ol>
          <p style="margin:14px 0 0">内容や評価の指定はありません。感じたことをそのままお寄せください。</p>
        </div>
        <a class="back-home" href="/">おぎココ公式サイトへ戻る</a>
      </div>
    </div>
  </main>
</body>
</html>
